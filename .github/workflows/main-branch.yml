
name: Protect Main Branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: write

jobs:
  check-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Check pull request author
        if: github.event.pull_request.user.login != 'sahansandaruwan'
        run: |
          echo "Only the repository owner can merge into main."
          exit 1
