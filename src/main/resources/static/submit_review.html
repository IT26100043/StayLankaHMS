<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #eef2f7;
        }
        .review-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .review-header {
            background-color: #1f5fbf;
            color: white;
            padding: 24px;
        }
        .review-header h2 {
            margin: 0;
            font-size: 26px;
        }
        .review-header p {
            margin: 4px 0 0 0;
            opacity: 0.9;
        }
        .form-label {
            font-weight: 600;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 14px;
        }
        .submit-btn {
            border-radius: 10px;
            padding: 12px;
            font-size: 17px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 560px;">
    <div class="card review-card">

        <div class="review-header">
            <h2>Share your stay</h2>
            <p>Tell other travelers about your room</p>
        </div>

        <div class="card-body p-4">
            <form id="reviewForm" onsubmit="return false;">

                <div class="mb-3">
                    <label class="form-label">Customer ID</label>
                    <input type="text" id="customerId" class="form-control" placeholder="Example: 1">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Room Type</label>
                        <select id="roomType" class="form-select">
                            <option>Standard</option>
                            <option>Deluxe</option>
                            <option>Suite</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Traveler Type</label>
                        <select id="travelerType" class="form-select">
                            <option>Solo Traveler</option>
                            <option>Couple</option>
                            <option>Family</option>
                            <option>Business</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Room Rating</label>
                        <select id="rating" class="form-select">
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Very good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Poor</option>
                            <option value="1">1 - Terrible</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Driver Facilities (optional)</label>
                        <select id="driverRating" class="form-select">
                            <option value="0">Not rated</option>
                            <option value="5">5</option>
                            <option value="4">4</option>
                            <option value="3">3</option>
                            <option value="2">2</option>
                            <option value="1">1</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Comment</label>
                    <textarea id="comment" class="form-control" rows="4" maxlength="300"
                              placeholder="What did you like about the room?" oninput="updateCount()"></textarea>
                    <div class="text-end text-muted small mt-1" id="count">0 / 300</div>
                </div>

                <button type="button" class="btn btn-primary w-100 submit-btn" onclick="submitReview()">
                    Submit Review
                </button>

                <div id="message" class="alert mt-3 d-none" role="alert"></div>

            </form>
        </div>
    </div>

    <p class="text-center mt-3">
        <a href="view_reviews.html">See all reviews</a>
    </p>
</div>

<script>
    function updateCount() {
        var length = document.getElementById("comment").value.length;
        document.getElementById("count").innerText = length + " / 300";
    }

    function showMessage(text, isSuccess) {
        var box = document.getElementById("message");
        box.innerText = text;
        box.classList.remove("d-none");

        if (isSuccess) {
            box.classList.remove("alert-danger");
            box.classList.add("alert-success");
        } else {
            box.classList.remove("alert-success");
            box.classList.add("alert-danger");
        }

        setTimeout(function () {
            box.classList.add("d-none");
        }, 4000);
    }

    function submitReview() {
        var data = {
            customerId: document.getElementById("customerId").value,
            roomType: document.getElementById("roomType").value,
            travelerType: document.getElementById("travelerType").value,
            rating: parseInt(document.getElementById("rating").value),
            driverRating: parseInt(document.getElementById("driverRating").value),
            comment: document.getElementById("comment").value
        };

        fetch("/reviews", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
        .then(function (response) {
            return response.text();
        })
        .then(function (message) {
            if (message == "Review saved") {
                showMessage("Thank you! Your review was saved.", true);
                document.getElementById("reviewForm").reset();
                updateCount();
            } else {
                showMessage(message, false);
            }
        });
    }
</script>

</body>
</html>
