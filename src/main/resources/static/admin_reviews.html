<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review Moderation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-1">Review Moderation</h2>
    <p class="text-muted mb-4">Admin only. Delete inappropriate or outdated reviews.</p>

    <div class="table-responsive bg-white border rounded">
        <table class="table mb-0">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Room</th>
                <th>Traveler</th>
                <th>Rating</th>
                <th>Driver</th>
                <th>Comment</th>
                <th>Admin view</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="reviewTable"></tbody>
        </table>
    </div>
</div>

<script>
    function safe(text) {
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    function loadReviews() {
        fetch("/reviews")
            .then(function (response) {
                return response.json();
            })
            .then(function (reviews) {
                fetch("/reviews/admin")
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (adminTexts) {
                        showTable(reviews, adminTexts);
                    });
            });
    }

    function showTable(reviews, adminTexts) {
        var html = "";

        for (var i = 0; i < reviews.length; i++) {
            var r = reviews[i];
            var driver = "Not rated";
            if (r.driverRating > 0) {
                driver = r.driverRating + "/5";
            }

            html = html + "<tr>";
            html = html + "<td>" + r.id + "</td>";
            html = html + "<td>" + safe(r.customerId) + "</td>";
            html = html + "<td>" + safe(r.roomType) + "</td>";
            html = html + "<td>" + safe(r.travelerType) + "</td>";
            html = html + "<td>" + r.rating + "/5</td>";
            html = html + "<td>" + driver + "</td>";
            html = html + "<td>" + safe(r.comment) + "</td>";
            html = html + "<td class='small text-muted'>" + safe(adminTexts[i]) + "</td>";
            html = html + "<td><button class='btn btn-outline-danger btn-sm' onclick='deleteReview(" + r.id + ")'>Delete</button></td>";
            html = html + "</tr>";
        }

        if (html == "") {
            html = "<tr><td colspan='9' class='text-muted'>No reviews yet.</td></tr>";
        }
        document.getElementById("reviewTable").innerHTML = html;
    }

    function deleteReview(id) {
        if (!confirm("Delete review " + id + "?")) {
            return;
        }

        fetch("/reviews/" + id + "?customerId=admin&role=ADMIN", {
            method: "DELETE"
        })
        .then(function (response) {
            return response.text();
        })
        .then(function (message) {
            alert(message);
            loadReviews();
        });
    }

    loadReviews();
</script>

</body>
</html>
