<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #eef2f7;
        }
        .review-box {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .form-control, .form-select {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 760px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Room Reviews</h2>
        <a href="submit_review.html" class="btn btn-primary">Write a Review</a>
    </div>

    <div class="row mb-4">
        <div class="col-md-4 mb-2">
            <label class="form-label">Room Type</label>
            <select id="roomFilter" class="form-select" onchange="showReviews()">
                <option value="">All</option>
                <option>Standard</option>
                <option>Deluxe</option>
                <option>Suite</option>
            </select>
        </div>
        <div class="col-md-4 mb-2">
            <label class="form-label">Traveler Type</label>
            <select id="travelerFilter" class="form-select" onchange="showReviews()">
                <option value="">All</option>
                <option>Solo Traveler</option>
                <option>Couple</option>
                <option>Family</option>
                <option>Business</option>
            </select>
        </div>
        <div class="col-md-4 mb-2">
            <label class="form-label">Your Customer ID</label>
            <input type="text" id="myId" class="form-control" placeholder="Example: 1">
        </div>
    </div>

    <div id="reviewList"></div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; overflow: hidden;">

            <div class="modal-header" style="background-color: #1f5fbf; color: white;">
                <h5 class="modal-title">Edit your review</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body p-4">
                <p class="text-muted" id="editInfo"></p>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Room Rating</label>
                        <select id="editRating" class="form-select">
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Very good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Poor</option>
                            <option value="1">1 - Terrible</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Traveler Type</label>
                        <select id="editTraveler" class="form-select">
                            <option>Solo Traveler</option>
                            <option>Couple</option>
                            <option>Family</option>
                            <option>Business</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Driver Facilities (optional)</label>
                    <select id="editDriver" class="form-select">
                        <option value="0">Not rated</option>
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Comment</label>
                    <textarea id="editComment" class="form-control" rows="4" maxlength="300"></textarea>
                </div>

                <div id="editMessage" class="alert alert-danger d-none"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveEdit()">Save changes</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    var allReviews = [];
    var editingReview = null;
    var editModal = new bootstrap.Modal(document.getElementById("editModal"));

    function safe(text) {
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    function loadReviews() {
        fetch("/reviews")
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                allReviews = data;
                showReviews();
            });
    }

    function showReviews() {
        var room = document.getElementById("roomFilter").value;
        var traveler = document.getElementById("travelerFilter").value;
        var html = "";

        for (var i = 0; i < allReviews.length; i++) {
            var r = allReviews[i];

            if (room != "" && r.roomType != room) {
                continue;
            }
            if (traveler != "" && r.travelerType != traveler) {
                continue;
            }

            var stars = "";
            for (var s = 0; s < r.rating; s++) {
                stars = stars + "★";
            }

            html = html + '<div class="card review-box mb-3"><div class="card-body">';
            html = html + '<h5 class="card-title">' + safe(r.roomType) + ' Room ';
            html = html + '<span class="badge bg-primary">' + safe(r.travelerType) + '</span></h5>';
            html = html + '<p class="text-warning fs-5 mb-1">' + stars + '</p>';
            html = html + '<p>' + safe(r.comment) + '</p>';

            if (r.driverRating > 0) {
                html = html + '<p class="mb-1">Driver facilities: ' + r.driverRating + '/5</p>';
            }

            html = html + '<p class="text-muted small">Customer ' + safe(r.customerId) + ', ' + r.date + '</p>';
            html = html + '<button class="btn btn-outline-primary btn-sm me-2" onclick="openEdit(' + i + ')">Edit</button>';
            html = html + '<button class="btn btn-outline-danger btn-sm" onclick="deleteReview(' + i + ')">Delete</button>';
            html = html + '</div></div>';
        }

        if (html == "") {
            html = '<p class="text-muted">No reviews found.</p>';
        }
        document.getElementById("reviewList").innerHTML = html;
    }

    function openEdit(index) {
        var myId = document.getElementById("myId").value;
        if (myId == "") {
            alert("Enter your Customer ID first.");
            return;
        }

        var r = allReviews[index];
        editingReview = r;

        document.getElementById("editInfo").innerText = r.roomType + " Room, " + r.date;
        document.getElementById("editRating").value = r.rating;
        document.getElementById("editTraveler").value = r.travelerType;
        document.getElementById("editDriver").value = r.driverRating;
        document.getElementById("editComment").value = r.comment;
        document.getElementById("editMessage").classList.add("d-none");

        editModal.show();
    }

    function saveEdit() {
        var data = {
            customerId: document.getElementById("myId").value,
            roomType: editingReview.roomType,
            travelerType: document.getElementById("editTraveler").value,
            rating: parseInt(document.getElementById("editRating").value),
            driverRating: parseInt(document.getElementById("editDriver").value),
            comment: document.getElementById("editComment").value
        };

        fetch("/reviews/" + editingReview.id, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
        .then(function (response) {
            return response.text();
        })
        .then(function (message) {
            if (message == "Review updated") {
                editModal.hide();
                loadReviews();
            } else {
                var box = document.getElementById("editMessage");
                box.innerText = message;
                box.classList.remove("d-none");
            }
        });
    }

    function deleteReview(index) {
        var r = allReviews[index];
        var myId = document.getElementById("myId").value;

        if (!confirm("Delete this review?")) {
            return;
        }

        fetch("/reviews/" + r.id + "?customerId=" + myId + "&role=CUSTOMER", {
            method: "DELETE"
        })
        .then(function (response) {
            return response.text();
        })
        .then(function (message) {
            alert(message);
            loadReviews();
        });
    }

    loadReviews();
</script>

</body>
</html>
